async function api(path,method='GET',body){const headers=admin?{Authorization:''}:{};if(method!=='GET'){headers['Content-Type']='application/json';if(admin)headers['X-Requested-With']='CIT-SaaS';if(csrf)headers['X-CSRF-Token']=csrf;else if(!(admin?['/admin-auth/login']:['/login','/register']).includes(path))throw new Error('Phiên đăng nhập chưa có mã bảo vệ. Vui lòng đăng nhập lại.');}const r=await fetch('/saas/api'+path,{method,headers,credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){if(admin&&r.status===401&&!['/admin-auth/login','/admin-auth/password'].includes(path)){goAdminLogin();const error=new Error('Phiên quản trị đã hết hạn. Vui lòng đăng nhập lại.');error.redirect=true;throw error;}let d;try{d=await r.json();}catch{}let msg=d?.detail||d?.error||d?.message; if(Array.isArray(msg))msg=msg.map(x=>Array.isArray(x?.loc)&&x.loc.includes('password')?'Mật khẩu phải có từ 12 đến 256 ký tự.':typeof x?.msg==='string'?x.msg:'Dữ liệu không hợp lệ.').join(' ');else if(typeof msg!=='string')msg=null; const err=new Error(msg||({401:'Vui lòng đăng nhập để tiếp tục.',403:'Bạn không có quyền thực hiện thao tác này.',429:'Hệ thống đang bận. Vui lòng thử lại sau.'}[r.status])||`Yêu cầu thất bại (${r.status}).`);err.status=r.status;throw err;}if(r.headers.get('content-type')?.includes('audio/')||r.headers.get('content-type')?.includes('octet-stream'))return r.blob();if(r.status===204)return {};return r.json();}
async function busy(button,task){button.disabled=true;const old=button.textContent;button.textContent='Đang xử lý…';notice('');try{await task();}catch(e){if(!e.redirect)notice(e.message,true);}finally{button.disabled=false;button.textContent=old;}}
function button(text,action,cls=''){const b=el('button',text,cls);b.type='button';b.onclick=()=>busy(b,action);return b;}
function field(form,label,name,type='text',value='',required=true){const wrap=el('label',label);const input=el(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.name=name;input.value=value??'';input.required=required;if(type==='password'){input.minLength=12;input.maxLength=256;}wrap.append(input);form.append(wrap);return input;}

function formSubmit(form,label,fn){const b=el('button',label,'primary');b.type='submit';form.append(b);form.onsubmit=e=>{e.preventDefault();if(!b.disabled)return busy(b,()=>fn(new FormData(form)));};return b;}

function table(parent,headers,rows){const wrap=el('div',null,'table-wrap'),t=el('table'),head=el('tr');headers.forEach(h=>head.append(el('th',h)));const th=el('thead');th.append(head);t.append(th);const body=el('tbody');if(!rows.length){const cell=el('td','Chưa có dữ liệu.');cell.colSpan=headers.length;const tr=el('tr');tr.append(cell);body.append(tr);}for(const row of rows){const tr=el('tr');for(const v of row){const td=el('td');td.append(v instanceof Node?v:document.createTextNode(String(v??'—')));tr.append(td);}body.append(tr);}t.append(body);wrap.append(t);parent.append(wrap);}
function nav(items){const n=$('#nav');n.replaceChildren();for(const [label,fn]of items)n.append(button(label,async()=>{await fn();},'nav-button'));}

async function auth(register=false){title('DONOMI VOICE','Giọng nói bắt đầu từ câu chữ.','Không gian tạo giọng nói và quản lý hạn mức của bạn.');const c=card(register?'Tạo tài khoản':'Chào mừng trở lại'),f=el('form');if(register)field(f,'Tên của bạn','name','text');const email=field(f,'Email','email','email');email.autocomplete='username';const pass=field(f,'Mật khẩu','password','password');pass.autocomplete=register?'new-password':'current-password';c.append(f);formSubmit(f,register?'Tạo tài khoản':'Đăng nhập',async data=>{const d=await api(register?'/register':'/login','POST',Object.fromEntries(data));csrf=d.session_csrf||'';await loadMe();});if(config.registration_enabled===true)c.append(button(register?'Đã có tài khoản? Đăng nhập':'Tạo tài khoản mới',()=>auth(!register),'secondary'));else c.append(el('p','Đăng ký công khai đang đóng. Vui lòng liên hệ người quản lý để được cấp tài khoản.','muted'));nav([]);}
async function loadMe(){me=await api('/me');csrf=me.session_csrf||csrf;nav([['Tổng quan',dashboard],['Tạo giọng nói',studio],['Khóa API',keys],['Lịch sử sử dụng',ledger],['Đăng xuất',async()=>{await api('/logout','POST',{});csrf='';me=null;await auth();}]]);dashboard();}
function dashboard(){title('KHÔNG GIAN CỦA BẠN',`Xin chào, ${me.user.name||me.user.email}`,'Theo dõi hạn mức và biến nội dung thành giọng nói.');const u=me.usage||{},p=me.plan;stats([['Gói hiện tại',planLabel(p)],['Đã dùng tháng này',number(u.used)],['Đang giữ chỗ',number(u.reserved)],['Còn lại',number(u.remaining)]]);const c=card('Hạn mức tháng');c.append(el('p',`Kỳ sử dụng: ${u.period||'—'} · Tổng hạn mức: ${number(u.limit??p?.char_limit)} ký tự`));const meter=el('progress');meter.max=Number(u.limit??p?.char_limit)||1;meter.value=Math.min(meter.max,(Number(u.used)||0)+(Number(u.reserved)||0));meter.setAttribute('aria-label','Hạn mức đã dùng và đang giữ chỗ');c.append(meter,el('p',`Tối đa ${number(p?.job_max_chars)} ký tự mỗi lần · ${number(p?.max_api_keys)} khóa API`),el('p',`Trạng thái tài khoản: ${me.user.status||'—'}`),button('Bắt đầu tạo giọng nói',studio,'primary'));c.append(el('p','Tất cả gói dùng chung mô hình giọng nói đang hoạt động. Đổi gói điều chỉnh hạn mức, không tạo mô hình riêng.','muted'));const b=card('Gói dịch vụ & thanh toán');b.append(el('p','Người quản lý duyệt thủ công và gán gói dịch vụ. Không có thanh toán hoặc nâng gói tự động.'),el('p',price(p),'badge'));}
function price(p){if(!p)return 'Chưa có thông tin giá';if(p.is_draft)return 'Giá nháp · chưa công bố';if(p.price_minor==null)return 'Chưa đặt giá';if(Number(p.price_minor)===0)return 'Miễn phí';return p.display_price||`${number(p.price_minor)} ${p.currency||config.currency||'JPY'} (đơn vị nhỏ nhất)`;}
async function keys(){title('KẾT NỐI','Khóa API','Khóa đầy đủ chỉ xuất hiện một lần ngay khi tạo. Hãy lưu ở nơi an toàn.');const c=card('Tạo khóa mới'),f=el('form');field(f,'Tên khóa','name','text','',true);c.append(f);const one=el('div');c.append(one);formSubmit(f,'Tạo khóa API',async data=>{one.replaceChildren();const d=await api('/keys','POST',Object.fromEntries(data));const value=field(one,'Khóa bí mật — chỉ hiển thị lần này','secret','text',d.api_key,false);value.readOnly=true;value.autocomplete='off';one.append(button('Sao chép khóa',async()=>{await navigator.clipboard.writeText(d.api_key);notice('Đã sao chép khóa.');},'secondary'));me=await api('/me');csrf=me.session_csrf||csrf;renderKeys();});const list=card('Khóa đang hoạt động');function renderKeys(){list.replaceChildren(el('h2','Khóa đang hoạt động'));table(list,['Tên','Tiền tố','Ngày tạo','Thao tác'],(me.api_keys||[]).map(k=>[k.name,k.prefix,date(k.created_at),button('Thu hồi',async()=>{if(!confirm(`Thu hồi khóa “${k.name}”? Ứng dụng dùng khóa này sẽ mất quyền truy cập.`))return;await api('/keys/'+encodeURIComponent(k.id),'DELETE');me=await api('/me');csrf=me.session_csrf||csrf;renderKeys();notice('Đã thu hồi khóa.');},'danger')]));}renderKeys();if(config.user_api_url)c.append(el('p',`Địa chỉ API: ${config.user_api_url}`,'mono'));}
async function ledger(){title('HOẠT ĐỘNG','Lịch sử sử dụng','Các tác vụ và lượng ký tự được ghi nhận từ hệ thống.');const d=await api('/usage');table(card('Sổ sử dụng'),['Thời gian','Mã tác vụ','Trạng thái','Ký tự','Chi tiết'],(d.items||[]).map(x=>[date(x.created_at),x.id,x.status,number(x.characters),x.error||'—']));if(d.has_more||d.next_cursor)root.append(el('p','Đang hiển thị trang dữ liệu đầu tiên từ API.','muted'));}
async function studio(){title('XƯỞNG GIỌNG NÓI','Để câu chữ cất tiếng.','Chọn giọng, nhập nội dung và tải âm thanh WAV.');const c=card('Nội dung của bạn'),f=el('form');c.append(f);const text=field(f,'Văn bản cần đọc','text','textarea');text.rows=8;const count=el('p','0 ký tự','muted');f.append(count);const max=Number(me.plan?.job_max_chars);text.oninput=()=>{count.textContent=`${Array.from(text.value).length.toLocaleString('vi-VN')} ký tự${max?' / '+number(max)+' mỗi lần':''}`;};const d=await api('/voices');const voices=Array.isArray(d)?d:(d.items||d.voices||[]);const options=voices.map(v=>typeof v==='string'?[v,v]:[v.id??v.voice_id,v.name||v.display_name||v.id||v.voice_id]).filter(v=>v[0]!=null);const selectedVoice=select(f,'Giọng đọc','voice_id',options,options[0]?.[0]);const language=field(f,'Ngôn ngữ của giọng đọc','language','text','');language.readOnly=true;function syncLanguage(){const v=voices.find(v=>String(typeof v==='string'?v:v.id??v.voice_id)===selectedVoice.value);language.value=typeof v==='object'?(v.language||''):'';language.required=true;}selectedVoice.onchange=syncLanguage;syncLanguage();const result=el('div',null,'audio-result');c.append(result);const submit=formSubmit(f,'Tạo âm thanh WAV',async data=>{const body=Object.fromEntries(data);if(!body.text.trim())throw new Error('Vui lòng nhập nội dung cần đọc.');if(max&&Array.from(body.text).length>max)throw new Error('Nội dung vượt hạn mức mỗi lần của gói.');const blob=await api('/tts/generate','POST',{...body,format:'wav'});if(!(blob instanceof Blob))throw new Error(typeof blob.detail==='string'?blob.detail:'Hệ thống chưa trả về âm thanh WAV. Vui lòng kiểm tra lịch sử sử dụng.');if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(blob);const audio=el('audio');audio.controls=true;audio.src=audioURL;const download=el('a','Tải xuống WAV','download');download.href=audioURL;download.download='cit-voice.wav';result.replaceChildren(audio,download);notice('Âm thanh đã sẵn sàng.');me=await api('/me');csrf=me.session_csrf||csrf;});if(!options.length){submit.disabled=true;c.append(el('p','Chưa có giọng đọc khả dụng. Vui lòng thử lại sau.','error'));}}
// Keep return destinations on this origin. Reject URL syntax that browsers normalize ambiguously.
function safeAdminNext(value){
 if(typeof value!=='string'||!value.startsWith('/')||value.startsWith('//')||/[\\\x00-\x20\x7f]/.test(value))return '/saas/admin';
 try{const target=new URL(value,location.origin);if(target.origin!==location.origin||/^\/saas\/admin\/login\/?$/.test(target.pathname))return '/saas/admin';return target.pathname+target.search+target.hash;}catch{return '/saas/admin';}
}
function goAdminLogin(message=''){
 csrf='';adminIdentity=null;redirecting=true;nav([]);root.replaceChildren();
 const next=safeAdminNext(location.pathname+(location.search||'')+(location.hash||''));
 location.replace('/saas/admin/login?next='+encodeURIComponent(next)+(message?'&reason='+encodeURIComponent(message):''));
}
function adminSignIn(){
 nav([]);title('OWNER WORKSPACE','Chào mừng người quản lý.','Đăng nhập để quản lý khách hàng, gói dịch vụ và hoạt động của Donomi Voice.');
 const c=card('Đăng nhập quản trị');c.className+=' admin-signin';
 c.append(el('p','Không gian dành riêng cho quản trị viên được cấp quyền.','muted'));
 const f=el('form');c.append(f);
 const username=field(f,'Tên đăng nhập','username');username.autocomplete='username';username.autocapitalize='none';username.spellcheck=false;
 const password=field(f,'Mật khẩu','password','password');password.autocomplete='current-password';
 formSubmit(f,'Đăng nhập quản trị',async data=>{
  try{const d=await api('/admin-auth/login','POST',Object.fromEntries(data));csrf=d.session_csrf||'';adminIdentity=d.admin;
   location.replace(safeAdminNext(new URLSearchParams(location.search||'').get('next')));
  }catch(e){if(e.status===401)throw new Error('Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.');throw e;}finally{password.value='';}
 });
 c.append(el('p','Quên mật khẩu? Liên hệ chủ hệ thống để được hỗ trợ.','muted'));
 if(new URLSearchParams(location.search||'').get('reason')==='password-changed')notice('Đã đổi mật khẩu và đăng xuất tất cả phiên. Vui lòng đăng nhập lại.');
}
function adminAccount(){
 title('TÀI KHOẢN QUẢN TRỊ','Bảo vệ tài khoản của bạn.','Đổi mật khẩu sẽ đăng xuất tất cả phiên quản trị, bao gồm phiên hiện tại.');
 const c=card('Thông tin tài khoản');c.append(el('p',adminIdentity.username),el('p',adminIdentity.name||'Quản trị viên'),el('p','Trạng thái: '+adminIdentity.status));
 const f=el('form');card('Đổi mật khẩu').append(f);
 const current=field(f,'Mật khẩu hiện tại','current_password','password');current.autocomplete='current-password';
 const fresh=field(f,'Mật khẩu mới · 12–256 ký tự','new_password','password');fresh.autocomplete='new-password';
 formSubmit(f,'Đổi mật khẩu & đăng xuất',async data=>{
  try{await api('/admin-auth/password','POST',Object.fromEntries(data));goAdminLogin('password-changed');}finally{current.value='';fresh.value='';}
 });
}
async function loadAdmin(){
 const d=await api('/admin-auth/me');adminIdentity=d.admin;csrf=d.session_csrf||'';config=await api('/config');
 nav([['Tổng quan',overview],['Yêu cầu tài khoản',accessRequests],['Studio quản lý mô hình',async()=>{location.assign('/studio');}],['Khách hàng',adminUsers],['Gói dịch vụ',adminPlans],['Tài khoản & mật khẩu',async()=>{location.hash='account';adminAccount();}],['Đăng xuất',async()=>{await api('/admin-auth/logout','POST',{});goAdminLogin();}]]);
 const identity=el('span',adminIdentity.username,'admin-identity');$('#nav').append(identity);
 if(location.hash==='#account')adminAccount();else await overview();
}
async function overview(){title('QUẢN TRỊ','Bức tranh tổng quan','Quản lý tài khoản, gói dịch vụ và quyền đăng ký.');const d=await api('/admin/overview');await getPlans();stats([['Tài khoản',number(d.users_count)],['Đang hoạt động',number(d.active_users)],['Ký tự đã dùng',number(d.used_characters)],['Tác vụ',number(d.jobs_count)]]);const c=card('Vận hành dịch vụ');c.append(el('p','Thanh toán thủ công · chưa tích hợp thu tiền trực tuyến.','badge'),el('p','Mọi gói dùng chung mô hình đang hoạt động. Hạn mức tháng, mỗi tác vụ và số khóa API được thiết lập theo gói.'));const f=el('form');const s=select(f,'Đăng ký tài khoản công khai','registration_enabled',[['false','Đóng — chỉ chủ hệ thống tạo tài khoản'],['true','Mở — cho phép tự đăng ký']],String(config.registration_enabled===true));const trialEnabled=plans.some(p=>String(p.id).toLowerCase()==='trial'&&p.enabled===true);s.options[1].disabled=!trialEnabled;if(!trialEnabled)c.append(el('p','Bật gói Trial trước khi mở đăng ký công khai.','muted'));c.append(f);formSubmit(f,'Lưu cài đặt đăng ký',async()=>{const value=s.value==='true';if(value){await getPlans();if(!plans.some(p=>String(p.id).toLowerCase()==='trial'&&p.enabled===true))throw new Error('Cần bật gói Trial trước khi mở đăng ký.');}await api('/admin/settings','PATCH',{registration_enabled:value});config.registration_enabled=value;notice('Đã lưu cài đặt đăng ký.');});}
async function getPlans(){const d=await api('/admin/plans');plans=d.items||[];}
function planOptions(){return [['','Chọn gói đang bật'],...plans.filter(p=>p.enabled===true).map(p=>[String(p.id),p.name])];}
async function accessRequests(){title('YÊU CẦU TÀI KHOẢN','Khách hàng đang quan tâm','Xem nhu cầu gửi từ homepage. Việc đánh dấu đã xem không tự tạo tài khoản hay kích hoạt gói.');const data=await api('/admin/access-requests');const labels={new:'Mới',reviewed:'Đã xem',closed:'Đã đóng'};table(card('Hộp thư yêu cầu'),['Thời gian','Họ tên & email','Nhu cầu','Trạng thái','Thao tác'],(data.items||[]).map(r=>{const actions=el('div');for(const [status,label]of [['reviewed','Đánh dấu đã xem'],['closed','Đóng yêu cầu']])if(r.status!==status)actions.append(button(label,async()=>{await api('/admin/access-requests/'+encodeURIComponent(r.id),'PATCH',{status});await accessRequests();},'secondary'));return [date(r.created_at),r.name+' · '+r.email,r.purpose||'—',labels[r.status]||r.status,actions];}));root.append(el('p','Hiển thị tối đa 500 yêu cầu gần nhất. Sau khi trao đổi và thống nhất gói, cấp tài khoản tại mục Khách hàng.','muted'));}
async function adminUsers(){title('TÀI KHOẢN','Khách hàng của bạn','Tạo tài khoản thủ công, điều chỉnh gói và trạng thái truy cập.');await getPlans();users=(await api('/admin/users')).items||[];const create=card('Cấp tài khoản mới'),f=el('form',null,'form-grid');field(f,'Tên','name');field(f,'Email','email','email');const pw=field(f,'Mật khẩu ban đầu','password','password');pw.autocomplete='new-password';select(f,'Gói dịch vụ','plan_id',planOptions(),'');create.append(f);if(!plans.some(p=>p.enabled===true))create.append(el('p','Chưa có gói đang bật. Hãy chỉnh sửa và bật một gói trước khi cấp tài khoản.','muted'));const createButton=formSubmit(f,'Tạo tài khoản',async data=>{const body=Object.fromEntries(data);await getPlans();if(!plans.some(p=>p.enabled===true&&String(p.id)===body.plan_id))throw new Error('Vui lòng chọn một gói đang bật trước khi tạo tài khoản.');body.status='active';await api('/admin/users','POST',body);await adminUsers();notice('Đã tạo tài khoản.');});createButton.disabled=!plans.some(p=>p.enabled===true);const list=card('Danh sách tài khoản');table(list,['Khách hàng','Trạng thái','Gói','Đã dùng','Thao tác'],users.map(u=>[`${u.name||'—'} · ${u.email}`,u.status,plans.find(p=>String(p.id)===String(u.plan_id))?.name||u.plan_id||'—',number(u.used_characters),button('Chỉnh sửa',async()=>editUser(u),'secondary')]));}
function editUser(u){const c=card(`Chỉnh sửa · ${u.email}`),f=el('form',null,'form-grid');select(f,'Trạng thái','status',[['active','Đang hoạt động'],['suspended','Tạm ngưng']],u.status);const choices=planOptions();const current=plans.find(p=>String(p.id)===String(u.plan_id));if(current&&current.enabled!==true)choices.push([String(current.id),current.name+' · gói hiện tại đã tắt']);select(f,'Gói dịch vụ','plan_id',choices,String(u.plan_id??''));const expiry=field(f,'Hết hạn gói (giờ địa phương; để trống = không hết hạn)','plan_expires_at','datetime-local','',false);if(u.plan_expires_at!=null){const d=timestamp(u.plan_expires_at);if(!isNaN(d)){expiry.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}}c.append(f);formSubmit(f,'Lưu tài khoản',async data=>{const body=Object.fromEntries(data);body.plan_id=body.plan_id||null;body.plan_expires_at=body.plan_expires_at?new Date(body.plan_expires_at).toISOString():null;await api('/admin/users/'+encodeURIComponent(u.id),'PATCH',body);await adminUsers();notice('Đã cập nhật tài khoản.');});c.append(button('Đóng',async()=>c.remove(),'secondary'));c.scrollIntoView({behavior:'smooth',block:'start'});}
async function adminPlans(){title('GÓI DỊCH VỤ','Cấu hình gói dịch vụ','Giá và hạn mức là cấu hình có thể chỉnh sửa, không phải báo giá bán. Giá để trống là chưa đặt.');await getPlans();root.append(button('Tạo gói dịch vụ',async()=>editPlan(null),'primary'));table(card('Các gói hiện có'),['Gói','Ký tự / tháng','Mỗi tác vụ','Khóa API','Giá','Trạng thái','Thao tác'],plans.map(p=>[p.name,number(p.char_limit),number(p.job_max_chars),number(p.max_api_keys),`${p.is_draft?'Bản nháp · ':''}${p.price_minor==null?'Chưa đặt giá':number(p.price_minor)+' '+(p.currency||'JPY')+' (đơn vị nhỏ nhất)'}${p.display_price?' · '+p.display_price:''}`,p.enabled?'Đang bật':'Đã tắt',button('Chỉnh sửa',async()=>editPlan(p),'secondary')]));root.append(el('p','Ban đầu Trial, Pro và Business đều là bản nháp và tắt để chủ hệ thống chỉnh sửa. Trial có giá cấu hình 0; Pro và Business chưa đặt giá. Bật một gói trước khi tạo tài khoản; bật Trial trước khi mở đăng ký. Dữ liệu trong bảng phản ánh cấu hình hiện tại từ API.','muted'));}
function editPlan(p){const c=card(p?'Chỉnh sửa gói':'Gói mới'),f=el('form',null,'form-grid');if(!p)field(f,'Mã gói','id');field(f,'Tên gói','name','text',p?.name);for(const [key,label]of [['char_limit','Ký tự mỗi tháng'],['job_max_chars','Ký tự tối đa mỗi tác vụ'],['max_api_keys','Số khóa API tối đa']]){const i=field(f,label,key,'number',p?.[key]??'');i.min='0';i.step='1';}const amount=field(f,'Giá (đơn vị tiền tệ nhỏ nhất; trống = chưa đặt)','price_minor','number',p?.price_minor??'',false);amount.min='0';amount.step='1';field(f,'Tiền tệ','currency','text',p?.currency||config.currency||'JPY');field(f,'Giá hiển thị (không bắt buộc)','display_price','text',p?.display_price||'',false);select(f,'Trạng thái','enabled',[['false','Tắt'],['true','Bật']],String(p?.enabled??false));select(f,'Trạng thái bản nháp','is_draft',[['true','Bản nháp'],['false','Đã duyệt cấu hình']],String(p?.is_draft??true));c.append(f);formSubmit(f,'Lưu gói',async data=>{const body=Object.fromEntries(data);for(const k of ['char_limit','job_max_chars','max_api_keys']){body[k]=Number(body[k]);if(!Number.isSafeInteger(body[k])||body[k]<0)throw new Error('Hạn mức phải là số nguyên không âm.');}body.price_minor=body.price_minor===''?null:Number(body.price_minor);if(body.price_minor!==null&&(!Number.isSafeInteger(body.price_minor)||body.price_minor<0))throw new Error('Giá phải là số nguyên không âm hoặc để trống.');body.enabled=body.enabled==='true';body.is_draft=body.is_draft==='true';await api('/admin/plans'+(p?'/'+encodeURIComponent(p.id):''),p?'PATCH':'POST',body);await adminPlans();notice('Đã lưu gói dịch vụ.');});c.append(button('Đóng',async()=>c.remove(),'secondary'));c.scrollIntoView({behavior:'smooth',block:'start'});}
async function init(){try{if(admin){$('#workspace').textContent='OWNER WORKSPACE';if(adminLoginPage){adminSignIn();return;}await loadAdmin();}else{config=await api('/config');try{await loadMe();}catch(e){if(e.status===401)await auth();else throw e;}}}catch(e){if(e.redirect||redirecting)return;notice(e.message,true);root.replaceChildren(el('h1','Chưa thể tải không gian làm việc'),el('p','Kiểm tra kết nối hoặc quyền truy cập, sau đó thử lại.'),button('Thử lại',init,'primary'));}}
window.addEventListener('beforeunload',()=>{if(audioURL)URL.revokeObjectURL(audioURL);});init();
</script></body></html>
