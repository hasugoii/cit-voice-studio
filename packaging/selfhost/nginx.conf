worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 8080;
    server_name voice.apps.donomi.jp;
    auth_basic "Donomi Voice Studio";
    auth_basic_user_file /run/cit-auth/htpasswd;
    client_max_body_size 100m;
    # Only upstream's explicit public API is reachable with API key alone.
    # Preserve remote classification so the app checks enabled/key itself.
    location ~ ^/public-api/(health|voices|stream|api/tts/generate|api/tts/generate-with-subtitles|api/tts/conversation|docs|docs/oauth2-redirect|openapi.json|cit-voice-studio.md)$ {
      auth_basic off;
      rewrite ^/public-api(/.*)$ $1 break;
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location /public-api/ {
      auth_basic off;
      return 404;
    }
    location / {
      # Reject browser writes originating on another site before treating the
      # authenticated administrator as local to this single-user application.
      if ($http_origin !~ "^(https://voice\.apps\.donomi\.jp)?$") { return 403; }
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8001;
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Real-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
