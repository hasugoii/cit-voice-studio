worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server {
    listen 8080;
    server_name voice.apps.donomi.jp;
    client_max_body_size 100m;
    # Session validation is internal and fails closed when backend is unavailable.
    location = /_owner_auth {
      internal;
      proxy_pass http://127.0.0.1:8001/saas/api/admin-auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization "";
      proxy_set_header Host $host;
      proxy_set_header Origin "";
    }
    location @admin_login { return 302 /saas/admin/login?next=$uri; }
    location @admin_api_unauthorized {
      default_type application/json;
      return 401 '{"detail":"Vui lòng đăng nhập tài khoản quản trị."}';
    }
    # Public marketing routes only. Owner /studio and API paths remain protected.
    location = / {
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /robots.txt {
      proxy_pass http://127.0.0.1:8001/saas/robots.txt;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /sitemap.xml {
      proxy_pass http://127.0.0.1:8001/saas/sitemap.xml;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /saas { return 308 /saas/; }
    location /saas/ {
      client_max_body_size 128k;
      proxy_pass http://127.0.0.1:8001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_read_timeout 1800s;
      proxy_buffering off;
    }
    # Only upstream's explicit public API is reachable with API key alone.
    # Preserve remote classification so the app checks enabled/key itself.
    location ~ ^/public-api/(health|voices|stream|api/tts/generate|api/tts/generate-with-subtitles|api/tts/conversation|docs|docs/oauth2-redirect|openapi.json|cit-voice-studio.md)$ {
      rewrite ^/public-api(/.*)$ $1 break;
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
    location /public-api/ {
      return 404;
    }
    location /api/ {
      auth_request /_owner_auth;
      error_page 401 = @admin_api_unauthorized;
      if ($http_origin !~ "^(https://voice\.apps\.donomi\.jp)?$") { return 403; }
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8001;
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Real-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Connection "";
      proxy_read_timeout 1800s;
    }
    location / {
      auth_request /_owner_auth;
      error_page 401 = @admin_login;
      # Reject browser writes originating on another site before treating the
      # session-authenticated administrator as local to this single-user application.
      if ($http_origin !~ "^(https://voice\.apps\.donomi\.jp)?$") { return 403; }
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8001;
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header Forwarded "";
      proxy_set_header X-Real-IP "";
      proxy_set_header CF-Connecting-IP "";
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_send_timeout 1800s;
    }
  }
}
